<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070708">
  <meta name="description" content="69Poker Premium Platform——撲克賽事直播、會員頻道、賽事資料與社群內容的一站式展示平台。">
  <meta property="og:title" content="69Poker Premium Platform">
  <meta property="og:description" content="全球頂級撲克賽事與會員直播平台概念網站。">
  <meta property="og:type" content="website">
  <title>69Poker Premium Platform</title>
  <link rel="icon" href="assets/six-nine-club-logo.png" type="image/png">
  <link rel="preload" as="image" href="assets/reference-home.png">
  <link rel="preload" as="image" href="assets/header-brand-stage-v2.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#page-content">跳至主要內容</a>
  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>

  <div class="app-shell">
    <aside class="sidebar" aria-label="主要導覽">
      <a class="brand-lockup route-link" href="#/" data-route="/" aria-label="69Poker 首頁">
        <span class="brand-mark"><span class="brand-disc"><img class="brand-base" src="assets/six-nine-club-logo.png" alt="Six & Nine Club 69 標誌"><img class="brand-nine-relief" src="assets/six-nine-club-logo.png" alt="" aria-hidden="true"></span></span>
        <span class="brand-copy"><b><em>69</em> POKER</b><small>SIX &amp; NINE CLUB</small></span>
      </a>

      <nav class="side-nav">
        <p class="nav-label">觀看</p>
        <a class="route-link" href="#/" data-route="/" data-nav="home"><span data-icon="home"></span><span>首頁<small>HOME</small></span></a>
        <a class="route-link" href="#/live" data-route="/live" data-nav="live"><span data-icon="live"></span><span>直播大廳<small>LIVE</small></span><em class="live-dot">8</em></a>
        <a class="route-link" href="#/tournaments" data-route="/tournaments" data-nav="tournaments"><span data-icon="trophy"></span><span>撲克賽事<small>TOURNAMENTS</small></span></a>
        <a class="route-link" href="#/live/high-stakes" data-route="/live/high-stakes" data-nav="high-stakes"><span data-icon="diamond"></span><span>高額桌<small>HIGH STAKES</small></span></a>

        <p class="nav-label">參與</p>
        <a class="route-link" href="#/live/creators" data-route="/live/creators" data-nav="creators"><span data-icon="video"></span><span>會員直播<small>CREATORS</small></span></a>
        <a class="route-link" href="#/community" data-route="/community" data-nav="community"><span data-icon="users"></span><span>社群短片<small>COMMUNITY</small></span></a>
        <a class="route-link" href="#/rankings" data-route="/rankings" data-nav="rankings"><span data-icon="chart"></span><span>積分榜<small>RANKINGS</small></span></a>

        <p class="nav-label">帳戶</p>
        <a class="route-link" href="#/member" data-route="/member" data-nav="member"><span data-icon="user"></span><span>會員中心<small>MEMBER</small></span></a>
        <a class="route-link" href="#/creator/live" data-route="/creator/live" data-nav="studio"><span data-icon="signal"></span><span>直播中心<small>STUDIO</small></span></a>
        <a class="route-link" href="#/settings" data-route="/settings" data-nav="settings"><span data-icon="settings"></span><span>偏好設定<small>SETTINGS</small></span></a>
      </nav>

      <div class="sidebar-promo">
        <span>69</span>
        <p>YOUR TABLE.<br><b>YOUR STORY.</b></p>
        <a class="route-link text-link" href="#/creator/apply" data-route="/creator/apply">申請成為實況主 <span>↗</span></a>
      </div>

      <div class="responsible-note"><span data-icon="shield"></span><p>內容展示平台<br><small>不提供下注或資金撮合</small></p></div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <button class="menu-toggle" type="button" aria-label="開啟導覽" aria-expanded="false"><span></span><span></span></button>
        <div class="context-title">
          <span class="context-motion" aria-hidden="true">
            <img class="motion-art" src="assets/header-brand-stage-v2.png" alt="">
            <span class="motion-digits">
              <span class="drop-trails"><i></i><i></i><i></i></span>
              <span class="digit-body"><i class="digit-six">6</i><i class="digit-nine">9</i></span>
              <i class="impact-wave"></i>
              <i class="impact-cracks"></i>
              <span class="impact-shards"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
            </span>
            <span class="motion-copy">
              <b><em>69</em> POKER</b>
              <small>SIX &amp; NINE CLUB</small>
            </span>
            <i class="motion-beam"></i>
          </span>
          <span class="context-signal" aria-hidden="true"><i></i> SIGNAL</span>
        </div>
        <div class="topbar-actions">
          <label class="global-search"><span data-icon="search"></span><input id="global-search" type="search" placeholder="搜尋直播、賽事或頻道" aria-label="搜尋直播、賽事或頻道"><kbd>⌘ K</kbd></label>
          <div class="on-air"><i></i><span>ON AIR</span><b>8,888</b></div>
          <button class="icon-button" type="button" data-action="notifications" aria-label="通知"><span data-icon="bell"></span><i class="notice-dot"></i></button>
          <div class="auth-actions" id="auth-actions">
            <a class="route-link button ghost compact" href="#/login" data-route="/login">登入</a>
            <a class="route-link button primary compact" href="#/signup" data-route="/signup">註冊</a>
          </div>
        </div>
      </header>

      <main id="page-content" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>

  <nav class="mobile-nav" aria-label="手機導覽">
    <a class="route-link" href="#/" data-route="/" data-nav="home"><span data-icon="home"></span><small>首頁</small></a>
    <a class="route-link" href="#/live" data-route="/live" data-nav="live"><span data-icon="live"></span><small>直播</small></a>
    <a class="route-link center-action" href="#/creator/live" data-route="/creator/live" data-nav="studio"><span data-icon="signal"></span><small>開播</small></a>
    <a class="route-link" href="#/community" data-route="/community" data-nav="community"><span data-icon="users"></span><small>社群</small></a>
    <a class="route-link" href="#/member" data-route="/member" data-nav="member"><span data-icon="user"></span><small>我的</small></a>
  </nav>

  <div class="search-results" id="search-results" hidden></div>
  <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>
  <div class="dialog-backdrop" id="dialog-backdrop" hidden></div>
  <script src="app.js"></script>
</body>
</html>
